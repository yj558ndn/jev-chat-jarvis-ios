# ============================================================================
# 放到你自己 fork 的仓库里：.github/workflows/build-ipa.yml
# 作用：在 GitHub 免费的 macOS 构建机上把 jev-chat-jarvis-ios 编成
#       「未签名 ipa」，下载后用全能签自签安装。整个过程不需要 Mac。
#
# 用法见同目录 README-自签安装.md。
#
# ── v4 相对 v3 的变化 ───────────────────────────────────────────────────────
# 多打一个补丁：判断层按官方口径发请求。治的是「意图徽章不管发什么消息都判成
# 同一类（实测一直落在『约会议』）、置信度还很低」——这不是模型很自信地判错，
# 是它在瞎挑。三处改动：
#   1) 新增 JevWire：发给 Jev 的 criteria 换成英文（官方口径：Jev 主训练语言是
#      英文，中文效果明显差），界面上的中文标签一个字不动，返回后再映射回来；
#   2) 风险量表换成英文的「具体情景」（官方明确要求，不写抽象程度）；
#   3) JSONSerialization 加 .sortedKeys：Swift 字典序列化成 JSON 时键序每次
#      进程启动都随机，键序一抖选择题就可能落到别的选项上，排序后请求体稳定。
#
# ── v3（保留）───────────────────────────────────────────────────────────────
# 编译前自动打补丁，让键盘不再依赖 App Group。
#   为什么需要：自签时 .appex 常常拿不到 App Groups 权限，导致
#   「主 App 能读共享容器、键盘读不到」——表现就是 App 首页第 1、2 行橙色，
#   键盘上一直显示「还没配置生成层」，而「试一试」页却完全正常。
#   补丁内容（App「模型」页加「复制配置到剪贴板」+ 键盘加「导入配置」）。
#
# ── v2（保留）───────────────────────────────────────────────────────────────
#   1) 去掉 -derivedDataPath：它必须配 -scheme，而我们用 -target
#   2) action 版本升到当前最新
#   3) 去掉第三方 setup-xcode：macos-latest 就是 macOS 26 + Xcode 27
#
# 两个补丁脚本的每个锚点都必须命中且只命中一次，否则立刻退出码 1 ——
# 宁可不构建，也不出一个打了半截补丁的包。
# ============================================================================
name: Build unsigned IPA

on:
  # 在 Actions 页面手动点按钮运行
  workflow_dispatch:
  # 每次 push 也自动编一份
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    # macos-latest = macOS 26 + Xcode 27（与作者验证过的工具链一致）
    # 如果这行报 "The label ... is not supported"，改成 macos-15 试试
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 取代码
        uses: actions/checkout@v7

      - name: 环境信息（排查用）
        run: |
          sw_vers
          echo "---"
          xcodebuild -version
          echo "---"
          xcode-select -p
          echo "--- 机器上装了哪些 Xcode ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "--- 工程里有哪些 target / scheme ---"
          xcodebuild -list -project JevJarvis.xcodeproj || true

      - name: 打补丁 1/2：让键盘不依赖 App Group
        run: |
          cat > /tmp/patch-appgroup.mjs <<'JSPATCH'
          // ============================================================================
          // 让键盘不再依赖 App Group（自签常见问题：主 App 能进共享容器，.appex 进不去）
          //
          // 原理：加一条"剪贴板搬运"通道。
          //   App「模型」页新增「复制配置到剪贴板」
          //   键盘待机页新增「导入配置」——把剪贴板里的配置存进【键盘自己的容器】
          // 键盘只要拿到「允许完全访问」就能读剪贴板，因此共享容器通不通都无所谓。
          //
          // 用法：node patch-appgroup.mjs <仓库根目录>
          // 任何锚点没命中都会立刻退出码 1（宁可不构建，也不出一个打了半截补丁的包）。
          // ============================================================================
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          import { join } from 'node:path';

          const root = process.argv[2] || '.';

          let hits = 0;
          function patch(rel, anchor, replacement, label) {
            const p = join(root, rel);
            if (!existsSync(p)) {
              console.error('✗ 找不到文件：' + rel);
              process.exit(1);
            }
            const src = readFileSync(p, 'utf8');
            const count = src.split(anchor).length - 1;
            if (count !== 1) {
              console.error('✗ 锚点命中 ' + count + ' 次（应为 1）：' + label + ' @ ' + rel);
              console.error('  锚点首行：' + anchor.split('\n')[0]);
              process.exit(1);
            }
            writeFileSync(p, src.replace(anchor, replacement), 'utf8');
            hits++;
            console.log('✓ ' + label + '  →  ' + rel);
          }

          // ---------------------------------------------------------------------------
          // 1) Shared/JevModel.swift —— 配置的编解码（纯 Foundation，不需要 UIKit）
          // ---------------------------------------------------------------------------
          const jevModelAnchor = [
            '#if DEBUG',
            '    private static let diagKey = "jev.diag.v1"',
          ].join('\n');

          const jevModelBlock = [
            '    // MARK: 配置搬运（签名没带 App Group 时的兜底通道）',
            '    //',
            '    // 正常情况配置放 App Group，App 与键盘读同一份。但自签工具不一定给键盘扩展',
            '    // 带上 App Groups 权限，那样键盘进不了共享容器（UserDefaults(suiteName:) 返回 nil，',
            '    // 静默退化成各自的私有容器），键盘就只能看到一份空配置。',
            '    // 这条通道绕开共享容器：',
            '    //   App「模型」页点「复制配置」→ 键盘上点「导入配置」→ 存进键盘自己的容器。',
            '',
            '    /// 信封标记：用来确认剪贴板里那段文本确实是本 App 导出的配置。',
            '    static let clipboardTag = "jev.config.clipboard.v1"',
            '',
            '    private struct ClipboardEnvelope: Codable {',
            '        var tag: String',
            '        var config: JevConfig',
            '    }',
            '',
            '    /// 把配置编码成一段可直接放进剪贴板的文本。',
            '    static func clipboardText(_ cfg: JevConfig) -> String? {',
            '        let env = ClipboardEnvelope(tag: clipboardTag, config: cfg)',
            '        guard let data = try? JSONEncoder().encode(env) else { return nil }',
            '        return String(data: data, encoding: .utf8)',
            '    }',
            '',
            '    /// 从剪贴板文本解出配置；不是本 App 导出的返回 nil。',
            '    static func config(fromClipboardText text: String) -> JevConfig? {',
            '        guard let data = text.data(using: .utf8),',
            '              let env = try? JSONDecoder().decode(ClipboardEnvelope.self, from: data),',
            '              env.tag == clipboardTag else { return nil }',
            '        return env.config',
            '    }',
            '',
          ].join('\n');

          patch('Shared/JevModel.swift', jevModelAnchor, jevModelBlock + jevModelAnchor, '配置编解码');

          // ---------------------------------------------------------------------------
          // 2) App/Sources/ProvidersView.swift —— 「复制配置到剪贴板」按钮
          // ---------------------------------------------------------------------------
          patch(
            'App/Sources/ProvidersView.swift',
            '    @State private var preset: String = "zhipu"',
            [
              '    @State private var preset: String = "zhipu"',
              '    @State private var clipboardNote: String?',
            ].join('\n'),
            '配置页状态位'
          );

          const providersAnchor = [
            '            TestConnectionButton(kind: .generation)',
            '',
            '            Text(genStatusLine)',
          ].join('\n');

          const providersBlock = [
            '            TestConnectionButton(kind: .generation)',
            '',
            '            // 剪贴板搬运：自签安装时键盘扩展常拿不到 App Groups 权限，读不到这里的配置。',
            '            // 点一下把配置放到剪贴板，键盘上「导入配置」即可，不必依赖共享容器。',
            '            Button {',
            '                if let text = JevStore.clipboardText(store.config) {',
            '                    UIPasteboard.general.string = text',
            '                    clipboardNote = jevLocalized(store.language,',
            '                        zh: "✅ 已复制：切到 Jev 键盘，点「导入配置」",',
            '                        en: "✅ Copied. Switch to the Jev keyboard and tap Import Config")',
            '                } else {',
            '                    clipboardNote = jevLocalized(store.language,',
            '                        zh: "❌ 配置文本生成失败", en: "❌ Failed to encode the config")',
            '                }',
            '            } label: {',
            '                Label(jevLocalized(store.language,',
            '                                   zh: "复制配置到剪贴板（给键盘用）",',
            '                                   en: "Copy config to clipboard (for the keyboard)"),',
            '                      systemImage: "doc.on.clipboard")',
            '            }',
            '',
            '            if let clipboardNote {',
            '                Text(clipboardNote).font(.caption).foregroundStyle(.secondary)',
            '            }',
            '',
            '            Text(genStatusLine)',
          ].join('\n');

          patch('App/Sources/ProvidersView.swift', providersAnchor, providersBlock, '复制配置按钮');

          // ---------------------------------------------------------------------------
          // 3) Keyboard/.../KeyboardViewController.swift —— 「导入配置」按钮 + 处理函数
          // ---------------------------------------------------------------------------
          patch(
            'Keyboard/Sources/KeyboardViewController.swift',
            '        tonesBtn.addTarget(self, action: #selector(openTonePicker), for: .touchUpInside)',
            [
              '        tonesBtn.addTarget(self, action: #selector(openTonePicker), for: .touchUpInside)',
              '',
              '        // 导入配置：自签安装时键盘扩展可能拿不到 App Groups 权限，读不到 App 里填的配置。',
              '        // 这时用 App「模型」页的「复制配置」把配置放进剪贴板，在这里一键搬进键盘自己的容器。',
              '        let importBtn = KB.button(L("导入配置", "Import Config"), icon: "square.and.arrow.down")',
              '        importBtn.heightAnchor.constraint(equalToConstant: 34).isActive = true',
              '        importBtn.addTarget(self, action: #selector(importConfigFromClipboard), for: .touchUpInside)',
            ].join('\n'),
            '导入按钮'
          );

          patch(
            'Keyboard/Sources/KeyboardViewController.swift',
            '        let vstack = UIStackView(arrangedSubviews: [guide, btnRow, tonesBtn])',
            '        let vstack = UIStackView(arrangedSubviews: [guide, btnRow, tonesBtn, importBtn])',
            '按钮入列'
          );

          patch(
            'Keyboard/Sources/KeyboardViewController.swift',
            '            vstack.addArrangedSubview(warn)',
            [
              '            vstack.addArrangedSubview(warn)',
              '            vstack.addArrangedSubview(KB.label(',
              '                L("若 App 里其实已经填好：点 App「模型」页的「复制配置」，再点上面的「导入配置」",',
              '                  "If it is already set up in the app: tap Copy config in Models, then Import Config above"),',
              '                font: .systemFont(ofSize: 11), color: KB.secondaryText, lines: 0))',
            ].join('\n'),
            '未配置提示'
          );

          patch(
            'Keyboard/Sources/KeyboardViewController.swift',
            '    @objc private func openTonePicker() { setMode(.tones) }',
            [
              '    /// 从剪贴板把 App 里的配置搬进键盘自己的容器（共享容器不可用时的兜底通道）。',
              '    @objc private func importConfigFromClipboard() {',
              '        let clip = UIPasteboard.general.string ?? ""',
              '        guard let cfg = JevStore.config(fromClipboardText: clip) else {',
              '            errorText = L("剪贴板里没有配置文本：先在 App「模型」页点「复制配置」",',
              '                          "No config text on the clipboard: tap Copy config in Models first")',
              '            setMode(.error)',
              '            return',
              '        }',
              '        JevStore.saveConfig(cfg)',
              '        setMode(.idle)',
              '    }',
              '',
              '    @objc private func openTonePicker() { setMode(.tones) }',
            ].join('\n'),
            '导入处理函数'
          );

          console.log('');
          console.log('补丁全部命中：' + hits + ' 处');

          JSPATCH
          node /tmp/patch-appgroup.mjs .
          echo "--- 补丁后的改动确认 ---"
          grep -nE "clipboardTag|clipboardText|复制配置到剪贴板" Shared/JevModel.swift App/Sources/ProvidersView.swift || true
          grep -nE "importConfigFromClipboard|导入配置" Keyboard/Sources/KeyboardViewController.swift || true

      - name: 打补丁 2/2：判断层按官方口径（英文 criteria）+ 请求体稳定
        run: |
          cat > /tmp/patch-judge-en.mjs <<'JSPATCH2'
          // ============================================================================
          // 让判断层按官方口径发请求（英文 instructions + 英文 criteria），并让请求体稳定
          //
          // 治的是这个病：App 里意图徽章不管发什么消息都判成同一类（用户实测「一直约会议」），
          // 置信度还很低（<40%）——不是模型很自信地判错，是它在瞎挑。
          //
          // 三处改动：
          //   1) Shared/JevPrompts.swift
          //        新增 JevWire（发给模型的英文 criteria + wire key → 中文界面标签的映射）
          //        + 固定顺序的界面标签表 + 英文风险量表（官方要求写「具体情景」）
          //        —— 界面标签、话术、ACTION_MAP、本地化全都不动，只换发给模型的那一份。
          //   2) Shared/JevJudge.swift
          //        两道题的 instructions/criteria 换成英文；解析改成「wire key → 中文标签」，
          //        兜底也改成按固定顺序找，不再扫字典键序（字典键序是随机的）。
          //   3) Shared/JevHTTP.swift
          //        JSONSerialization 加 .sortedKeys —— Swift 字典序列化成 JSON 时键序每次进程
          //        启动都不同，键序一抖，选择题就可能落到别的选项上；排序后请求体逐字节稳定。
          //
          // 用法：node patch-judge-en.mjs <仓库根目录>
          // 任何锚点没命中都会立刻退出码 1（宁可不构建，也不出一个打了半截补丁的包）。
          // ============================================================================
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          import { join } from 'node:path';

          const root = process.argv[2] || '.';

          let hits = 0;
          function patch(rel, anchor, replacement, label) {
            const p = join(root, rel);
            if (!existsSync(p)) {
              console.error('✗ 找不到文件：' + rel);
              process.exit(1);
            }
            const src = readFileSync(p, 'utf8');
            const count = src.split(anchor).length - 1;
            if (count !== 1) {
              console.error('✗ 锚点命中 ' + count + ' 次（应为 1）：' + label + ' @ ' + rel);
              console.error('  锚点首行：' + anchor.split('\n')[0]);
              process.exit(1);
            }
            writeFileSync(p, src.replace(anchor, replacement), 'utf8');
            hits++;
            console.log('✓ ' + label + '  →  ' + rel);
          }

          // ---------------------------------------------------------------------------
          // 1) JevPrompts.swift：保留中文界面标签，新增 wire 层
          // ---------------------------------------------------------------------------

          const PROMPTS_ANCHOR = `/// 8 类意图：Jev choice 题的 criteria，同时是界面上的意图标签。
          let INTENTS: [String: String] = [
              "派活": "对方要我做一件事或接一个任务",
              "催进度": "对方在催促我尽快完成某个已在办的事",
              "问进度": "对方在询问某件事的进展或状态",
              "批评": "对方对我的工作或结果表达不满、指出错误",
              "要解释": "对方要求我说明原因或给出解释",
              "闲聊": "对方只是在聊天、分享或表达感受，没有具体要求",
              "约会议": "对方想安排一次会议或通话",
              "夸奖": "对方在肯定、称赞我的成果",
          ]`;

          const PROMPTS_REPLACEMENT = `/// 8 类意图：界面上的意图标签，同时也是 ACTION_MAP 的键。
          /// 注意：这份【不再直接发给模型】——发给模型的 criteria 见下面的 JevWire。
          let INTENTS: [String: String] = [
              "派活": "对方要我做一件事或接一个任务",
              "催进度": "对方在催促我尽快完成某个已在办的事",
              "问进度": "对方在询问某件事的进展或状态",
              "批评": "对方对我的工作或结果表达不满、指出错误",
              "要解释": "对方要求我说明原因或给出解释",
              "闲聊": "对方只是在聊天、分享或表达感受，没有具体要求",
              "约会议": "对方想安排一次会议或通话",
              "夸奖": "对方在肯定、称赞我的成果",
          ]

          /// 界面标签的固定顺序。字典键序是随机的，凡是「按顺序」的地方都必须用它。
          let INTENT_DISPLAY_ORDER: [String] = [
              "派活", "催进度", "问进度", "批评", "要解释", "闲聊", "约会议", "夸奖",
          ]

          // MARK: - wire 层：真正发给 Jev 的那一份 criteria
          //
          // 为什么单独一层：官方口径（安卓版 CLAUDE.md 与 tools/jev/TASK.md）写明——
          //   「instructions 和 criteria 一律用英文（Jev 主训练语言是英文，中文效果明显差）；
          //     state 里的聊天内容保留中文原文」。
          // iOS 版此前把中文标签直接当 criteria 发出去，模型挑不准：表现就是意图徽章总落在
          // 同一类上、置信度还很低。这里只换「发给模型的那一份」，界面标签一个字不动，
          // 模型回什么 wire key 再映射回中文标签。
          enum JevWire {
              /// 顺序固定写成数组，不要用 Dictionary：Swift 字典的键序每次启动都不同。
              static let intentCriteriaPairs: [(String, String)] = [
                  ("assign_task", "The other person wants me to take on a task, or is handing me work"),
                  ("chase_progress", "The other person is pressing me to finish something that is already in progress"),
                  ("ask_progress", "The other person is asking about the progress or status of something"),
                  ("criticize", "The other person is unhappy with my work or results, or is pointing out a mistake"),
                  ("ask_explanation", "The other person wants me to explain the reason or justify myself"),
                  ("small_talk", "The other person is only chatting, sharing or expressing feelings, with no concrete request"),
                  ("schedule_meeting", "The other person wants to arrange a meeting or a call"),
                  ("praise", "The other person is complimenting or affirming my work"),
              ]

              /// wire key → 界面用的中文标签（与 INTENT_DISPLAY_ORDER 一一对应）
              static let wireToIntent: [String: String] = [
                  "assign_task": "派活",
                  "chase_progress": "催进度",
                  "ask_progress": "问进度",
                  "criticize": "批评",
                  "ask_explanation": "要解释",
                  "small_talk": "闲聊",
                  "schedule_meeting": "约会议",
                  "praise": "夸奖",
              ]

              static func intentCriteria() -> [String: String] {
                  var o: [String: String] = [:]
                  for (k, v) in intentCriteriaPairs { o[k] = v }
                  return o
              }

              /// 模型回什么就映射回界面标签。认不出来时按【固定顺序】找包含关系，
              /// 绝不扫字典键序（那样每次启动的结果都不一样）。实在认不出兜底「闲聊」。
              static func intentLabel(from raw: String) -> String {
                  var s = raw.trimmingCharacters(in: .whitespacesAndNewlines)
                  // 有些网关会把选中的选项原样加引号回显
                  let quotes: [(Character, Character)] = [("\\"", "\\""), ("'", "'"), ("“", "”"), ("「", "」")]
                  for (open, close) in quotes where s.hasPrefix(String(open)) && s.hasSuffix(String(close)) && s.count >= 2 {
                      s = String(s.dropFirst().dropLast())
                  }
                  s = s.trimmingCharacters(in: .whitespacesAndNewlines)
                  if s.isEmpty { return "闲聊" }
                  let lower = s.lowercased()
                  if let label = wireToIntent[s] ?? wireToIntent[lower] { return label }
                  if INTENTS[s] != nil { return s }   // 兼容老网关直接回中文标签
                  for (wire, _) in intentCriteriaPairs where lower.contains(wire.lowercased()) {
                      if let label = wireToIntent[wire] { return label }
                  }
                  for label in INTENT_DISPLAY_ORDER where s.contains(label) { return label }
                  return "闲聊"
              }
          }

          /// 风险量表（发给 Jev 的英文版）：官方明确要求每档写【具体情景】，不写抽象程度。
          /// 档数与 RISK_LEVELS 严格一致（都是 10 档），所以界面上的中文风险文案不用改。
          let RISK_CRITERIA_EN: [String] = [
              "Casual chat with no stakes; any natural reply works",
              "Small talk or banter; an off reply changes nothing",
              "An ordinary everyday message; a plain, normal reply is fine",
              "A mild request or a little pressure; keep the wording clean",
              "A little sensitive; the other person may read into the wording",
              "Careful wording needed; a careless reply invites nitpicking",
              "Risky; a bad reply could offend them or step on a landmine",
              "Quite risky; the wrong wording causes a real problem",
              "Very risky; responsibility, blame or money is on the line",
              "Extremely risky; the other person is angry or issuing an ultimatum — do not reply yet",
          ]`;

          patch('Shared/JevPrompts.swift', PROMPTS_ANCHOR, PROMPTS_REPLACEMENT, '新增 wire 层（英文 criteria）');

          // ---------------------------------------------------------------------------
          // 2) JevJudge.swift：题目换英文 + 解析走 wire 映射
          // ---------------------------------------------------------------------------

          const JUDGE_QUESTIONS_ANCHOR = `            "questions": [
                          "intent": [
                              "type": "choice",
                              "instructions": "这句话的真实意图是什么？",
                              "criteria": INTENTS,
                          ] as [String: Any],
                          "risk": [
                              "type": "score",
                              "instructions": "如果直接回复这句话，风险有多大？",
                              "criteria": RISK_LEVELS,
                          ] as [String: Any],
                      ],`;

          const JUDGE_QUESTIONS_REPLACEMENT = `            "questions": [
                          "intent": [
                              "type": "choice",
                              "instructions": "What is the real intent behind this message?",
                              "criteria": JevWire.intentCriteria(),
                          ] as [String: Any],
                          "risk": [
                              "type": "score",
                              "instructions": "How risky would it be to reply to this message directly?",
                              "criteria": RISK_CRITERIA_EN,
                          ] as [String: Any],
                      ],`;

          patch('Shared/JevJudge.swift', JUDGE_QUESTIONS_ANCHOR, JUDGE_QUESTIONS_REPLACEMENT, '两道题换英文 instructions/criteria');

          const JUDGE_PARSE_ANCHOR = `        var intent = intentAns["choice"] as? String ?? "闲聊"
                  if !INTENTS.keys.contains(intent) {
                      // 网关偶尔回显下标或近似标签
                      intent = INTENTS.keys.first { intent.contains($0) } ?? "闲聊"
                  }`;

          const JUDGE_PARSE_REPLACEMENT = `        // wire key（英文）→ 界面标签（中文）。兜底也走固定顺序，不碰字典键序。
                  let intent = JevWire.intentLabel(from: intentAns["choice"] as? String ?? "")`;

          patch('Shared/JevJudge.swift', JUDGE_PARSE_ANCHOR, JUDGE_PARSE_REPLACEMENT, '解析改走 wire 映射（兜底固定顺序）');

          // 2c) 排序题（best_reply）的 instructions 也换成英文。
          // 官方口径：唯独这道题的 criteria「值」允许用中文——那本来就是待选的候选原文；
          // 但 instructions 仍要英文。
          const JUDGE_RANK_ANCHOR = `                "best": [
                              "type": "choice",
                              "instructions": "哪一条回复最合适？",
                              "criteria": criteria,
                          ] as [String: Any],`;

          const JUDGE_RANK_REPLACEMENT = `                "best": [
                              "type": "choice",
                              "instructions": "Which reply would be the most appropriate to send?",
                              "criteria": criteria,
                          ] as [String: Any],`;

          patch('Shared/JevJudge.swift', JUDGE_RANK_ANCHOR, JUDGE_RANK_REPLACEMENT, '排序题 instructions 换英文（criteria 仍是候选原文）');

          // ---------------------------------------------------------------------------
          // 3) JevHTTP.swift：请求体加 .sortedKeys
          // ---------------------------------------------------------------------------

          const HTTP_ANCHOR = `        let payload = try JSONSerialization.data(withJSONObject: body)`;

          const HTTP_REPLACEMENT = `        // .sortedKeys：Swift 字典序列化成 JSON 时键序【每次进程启动都随机】，
                  // 键序一抖，判断层的选择题就可能落到别的选项上（用户实测：同一个 App 里
                  // 意图总判成同一类、置信度还很低）。排序后请求体逐字节稳定，同一段对话
                  // 每次得到同一个判断。
                  let payload = try JSONSerialization.data(withJSONObject: body, options: [.sortedKeys])`;

          patch('Shared/JevHTTP.swift', HTTP_ANCHOR, HTTP_REPLACEMENT, '请求体加 .sortedKeys（键序不再随机）');

          // ---------------------------------------------------------------------------
          // 4) 补后自检：确认该换的都换了、没留下中文 criteria
          // ---------------------------------------------------------------------------

          const judgeSrc = readFileSync(join(root, 'Shared/JevJudge.swift'), 'utf8');
          const mustBeGone = ['"criteria": INTENTS', '"criteria": RISK_LEVELS', '这句话的真实意图是什么', '如果直接回复这句话，风险有多大', '哪一条回复最合适'];
          for (const bad of mustBeGone) {
            if (judgeSrc.includes(bad)) {
              console.error('✗ 自检失败：JevJudge.swift 里还留着 ' + bad);
              process.exit(1);
            }
          }
          for (const need of ['JevWire.intentCriteria()', 'JevWire.intentLabel(from:', 'RISK_CRITERIA_EN', 'the most appropriate to send']) {
            if (!judgeSrc.includes(need)) {
              console.error('✗ 自检失败：JevJudge.swift 里没找到 ' + need);
              process.exit(1);
            }
          }
          // 三道题的 instructions 一律不许再有中文（官方口径）
          const chineseInstructions = [...judgeSrc.matchAll(/"instructions":\s*"([^"]*)"/g)]
            .map((m) => m[1])
            .filter((s) => /[\u4e00-\u9fff]/.test(s));
          if (chineseInstructions.length) {
            console.error('✗ 自检失败：JevJudge.swift 里还有中文 instructions：' + JSON.stringify(chineseInstructions));
            process.exit(1);
          }
          const promptsSrc = readFileSync(join(root, 'Shared/JevPrompts.swift'), 'utf8');
          for (const need of ['enum JevWire', 'static let wireToIntent', 'let RISK_CRITERIA_EN', 'let INTENT_DISPLAY_ORDER']) {
            if (!promptsSrc.includes(need)) {
              console.error('✗ 自检失败：JevPrompts.swift 里没找到 ' + need);
              process.exit(1);
            }
          }
          console.log('✓ 自检通过：' + hits + ' 处补丁全部命中，且英文 criteria 已就位');

          JSPATCH2
          node /tmp/patch-judge-en.mjs .
          echo "--- 补丁后的改动确认 ---"
          grep -nE "enum JevWire|wireToIntent|RISK_CRITERIA_EN|INTENT_DISPLAY_ORDER" Shared/JevPrompts.swift || true
          grep -nE "JevWire.intentCriteria|JevWire.intentLabel|RISK_CRITERIA_EN" Shared/JevJudge.swift || true
          grep -nE "sortedKeys" Shared/JevHTTP.swift || true
          echo "--- 反查：这几处【不应该】再出现（出现就是补丁没打上）---"
          if grep -nE '"criteria": INTENTS|"criteria": RISK_LEVELS' Shared/JevJudge.swift; then
            echo "::error::判断层还在用中文 criteria，补丁没生效"
            exit 1
          fi
          echo "ok：中文 criteria 已全部换掉"

      - name: 编译（不做任何代码签名）
        # 注意：这里刻意不加 -derivedDataPath。
        # xcodebuild 规定 -derivedDataPath 只能和 -scheme 一起用，而 -target 才是
        # 作者 README 里验证过的用法（工程里不一定有共享 scheme）。
        # 产物位置下一步用 -showBuildSettings 问出来，不靠猜。
        run: |
          set -euo pipefail
          xcodebuild \
            -project JevJarvis.xcodeproj \
            -target JevJarvis \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 80

      - name: 定位 App、校验键盘扩展、打包成未签名 ipa
        run: |
          set -euo pipefail

          BUILT="$(xcodebuild -project JevJarvis.xcodeproj -target JevJarvis \
                     -configuration Release -sdk iphoneos -showBuildSettings 2>/dev/null \
                   | awk -F' = ' '/ BUILT_PRODUCTS_DIR = /{print $2; exit}')"
          echo "BUILT_PRODUCTS_DIR = ${BUILT:-（没问出来）}"

          APP="${BUILT:-}/JevJarvis.app"
          if [ ! -d "$APP" ]; then
            echo "预期位置没有，改用 find 在 DerivedData 里搜"
            APP="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name 'JevJarvis.app' \
                   -path '*Release-iphoneos*' 2>/dev/null | head -n 1 || true)"
          fi
          echo "APP = ${APP:-（没找到）}"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::找不到 JevJarvis.app，编译产物不在预期位置"
            exit 1
          fi

          echo "=== App 内容 ==="
          ls -la "$APP"
          echo "=== PlugIns（键盘扩展应该在这里）==="
          ls -la "$APP/PlugIns" || true

          if [ ! -d "$APP/PlugIns/JevKeyboard.appex" ]; then
            echo "::error::App 里没有 PlugIns/JevKeyboard.appex，键盘扩展没被嵌进去，这个包装上也用不了键盘"
            exit 1
          fi

          rm -rf Payload JevJarvis-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JevJarvis-unsigned.ipa Payload
          ls -la JevJarvis-unsigned.ipa
          echo "=== ipa 结构（应包含 JevKeyboard.appex）==="
          unzip -l JevJarvis-unsigned.ipa | head -n 30

      - name: 把结果和错误写到运行页上（无论成败都执行）
        if: always()
        run: |
          {
            echo "## 结果"
            if [ -f JevJarvis-unsigned.ipa ]; then
              echo "- ✅ 已生成 JevJarvis-unsigned.ipa（$(du -h JevJarvis-unsigned.ipa | cut -f1)）"
              echo "- 去本页最下方 Artifacts 下载"
              echo "- 这个包带两个补丁：键盘不依赖 App Group + 判断层按官方口径（英文 criteria）"
            else
              echo "- ❌ 没有生成 ipa（看下面的错误行）"
            fi
            echo ""
            echo "### 环境"
            echo '```'
            sw_vers || true
            xcodebuild -version || true
            echo '```'
            if [ -f build.log ]; then
              echo "### 编译日志里的错误行"
              echo '```'
              grep -i -E "error:|xcodebuild: error|requires a development team|The following build commands failed|Command .* failed" build.log | tail -n 40 || true
              echo '```'
              echo "### 日志最后 30 行"
              echo '```'
              tail -n 30 build.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 ipa（运行记录页底部 Artifacts 下载）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: JevJarvis-unsigned-ipa
          path: JevJarvis-unsigned.ipa
          if-no-files-found: warn

      - name: 编译日志也传一份
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
