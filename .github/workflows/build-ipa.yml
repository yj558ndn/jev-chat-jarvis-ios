# Put this file in your fork at: .github/workflows/build-ipa.yml
# Builds jev-chat-jarvis-ios into an UNSIGNED ipa on GitHub's free macOS runner.
# Then sign it yourself (全能签 or any sideload signing tool). No Mac needed.
#
# Full walkthrough: README-自签安装.md
#
# v2 fixes (the previous run died with exit code 64):
#   1) removed -derivedDataPath: xcodebuild requires -scheme when using it,
#      but this project is built with -target
#   2) bumped actions to current majors (v4 is three majors behind)
#   3) dropped the third-party setup-xcode action: macos-latest is now
#      macOS 26 + Xcode 27, which is the toolchain the author verified with
# ============================================================================
name: Build unsigned IPA

on:
  # Click "Run workflow" on the Actions tab
  workflow_dispatch:
  # Also build on every push
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    # macos-latest = macOS 26 + Xcode 27
    # If this fails with "The label ... is not supported", try macos-15
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Environment info
        run: |
          sw_vers
          echo "---"
          xcodebuild -version
          echo "---"
          xcode-select -p
          echo "--- installed Xcodes ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "--- targets / schemes in the project ---"
          xcodebuild -list -project JevJarvis.xcodeproj || true

      - name: Build (no code signing at all)
        # Deliberately no -derivedDataPath here: xcodebuild only accepts it
        # together with -scheme, and -target is the author's verified way.
        # The product path is asked for with -showBuildSettings in the next step.
        run: |
          set -euo pipefail
          xcodebuild \
            -project JevJarvis.xcodeproj \
            -target JevJarvis \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 80

      - name: Locate app, verify keyboard extension, package unsigned ipa
        run: |
          set -euo pipefail

          BUILT="$(xcodebuild -project JevJarvis.xcodeproj -target JevJarvis \
                     -configuration Release -sdk iphoneos -showBuildSettings 2>/dev/null \
                   | awk -F' = ' '/ BUILT_PRODUCTS_DIR = /{print $2; exit}')"
          echo "BUILT_PRODUCTS_DIR = ${BUILT:-unknown}"

          APP="${BUILT:-}/JevJarvis.app"
          if [ ! -d "$APP" ]; then
            echo "not at the expected path, searching DerivedData"
            APP="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name 'JevJarvis.app' \
                   -path '*Release-iphoneos*' 2>/dev/null | head -n 1 || true)"
          fi
          echo "APP = ${APP:-not found}"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::JevJarvis.app not found - build products are not where expected"
            exit 1
          fi

          echo "=== App contents ==="
          ls -la "$APP"
          echo "=== PlugIns (the keyboard extension must be here) ==="
          ls -la "$APP/PlugIns" || true

          if [ ! -d "$APP/PlugIns/JevKeyboard.appex" ]; then
            echo "::error::JevKeyboard.appex is missing - the extension was not embedded, the package would be useless"
            exit 1
          fi

          rm -rf Payload JevJarvis-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JevJarvis-unsigned.ipa Payload
          ls -la JevJarvis-unsigned.ipa
          echo "=== ipa layout (should contain JevKeyboard.appex) ==="
          unzip -l JevJarvis-unsigned.ipa | head -n 30

      - name: Write result and errors to the run page (always)
        if: always()
        run: |
          {
            echo "## Result"
            if [ -f JevJarvis-unsigned.ipa ]; then
              echo "- OK: JevJarvis-unsigned.ipa built ($(du -h JevJarvis-unsigned.ipa | cut -f1))"
              echo "- Download it under Artifacts at the bottom of this page"
            else
              echo "- FAILED: no ipa was produced (see the error lines below)"
            fi
            echo ""
            echo "### Environment"
            echo '```'
            sw_vers || true
            xcodebuild -version || true
            echo '```'
            if [ -f build.log ]; then
              echo "### Error lines from the build log"
              echo '```'
              grep -i -E "error:|xcodebuild: error|requires a development team|The following build commands failed|Command .* failed" build.log | tail -n 40 || true
              echo '```'
              echo "### Last 30 lines of the log"
              echo '```'
              tail -n 30 build.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ipa (download under Artifacts)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: JevJarvis-unsigned-ipa
          path: JevJarvis-unsigned.ipa
          if-no-files-found: warn

      - name: Upload build log too
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
