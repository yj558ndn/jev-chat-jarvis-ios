# ============================================================================
# 放到你自己 fork 的仓库里：.github/workflows/build-ipa.yml
# 作用：在 GitHub 免费的 macOS 构建机上把 jev-chat-jarvis-ios 编成
#       「未签名 ipa」，下载后用全能签自签安装。整个过程不需要 Mac。
#
# 用法见同目录 README-自签安装.md。
# ============================================================================
name: Build unsigned IPA

on:
  # 在 Actions 页面手动点按钮运行
  workflow_dispatch:
  # 也可以每次 push 自动编一份
  push:
    branches: [master, main]

jobs:
  build:
    # 如果报错 "The label 'macos-15' is not supported"，把这行改成 macos-latest
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 打印 Xcode 版本（方便排查）
        run: |
          xcodebuild -version
          echo "---"
          xcode-select -p

      - name: 尽量切到最新 Xcode（失败不阻塞）
        continue-on-error: true
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 编译（完全不做签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project JevJarvis.xcodeproj \
            -target JevJarvis \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 250

      - name: 检查产物里有没有键盘扩展
        run: |
          APP="build/Build/Products/Release-iphoneos/JevJarvis.app"
          echo "=== App 内容 ==="
          ls -la "$APP"
          echo "=== PlugIns（键盘扩展应该在这里）==="
          ls -la "$APP/PlugIns" || true
          if [ ! -d "$APP/PlugIns/JevKeyboard.appex" ]; then
            echo "::error::没找到 JevKeyboard.appex，扩展没有被嵌进 App，打出来的包装上也用不了键盘"
            exit 1
          fi

      - name: 打成未签名 ipa
        run: |
          rm -rf Payload JevJarvis-unsigned.ipa
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/JevJarvis.app" Payload/
          zip -qry JevJarvis-unsigned.ipa Payload
          ls -la JevJarvis-unsigned.ipa
          echo "=== ipa 结构（应包含 JevKeyboard.appex）==="
          unzip -l JevJarvis-unsigned.ipa | head -n 40

      - name: 上传 ipa（在运行记录页底部 Artifacts 下载）
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-unsigned-ipa
          path: JevJarvis-unsigned.ipa
          if-no-files-found: error

      - name: 编译日志也传一份（失败了看它）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
